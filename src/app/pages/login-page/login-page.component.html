<div class="container">
  <h2 class="title"><fa-icon [icon]="faSignInAlt"></fa-icon> Login</h2>

  <div class="containerForm">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
      <div class="inputContainer">
        <input
          class="input"
          formControlName="email"
          placeholder="Insira seu e-mail"
          type="email"
          required
          autocomplete="email"
        />
      </div>
      <div class="inputContainer">
        <div class="passwordInputWrapper">
          <input
            class="input"
            [type]="passwordFieldType"
            formControlName="password"
            placeholder="Insira sua senha"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="togglePassword"
            (click)="togglePasswordVisibility()"
          >
            <fa-icon
              [icon]="passwordFieldType === 'password' ? faEye : faEyeSlash"
            ></fa-icon>
          </button>
        </div>
        <div *ngIf="errorMessage" class="containerError">
          <p class="error">{{ errorMessage }}</p>
        </div>
      </div>
      <button type="submit" class="button">
        <fa-icon [icon]="faSignInAlt"></fa-icon> Entrar
      </button>
    </form>
  </div>
</div>
